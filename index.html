<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Pexel Wallpaper</title>
    <style>
        html, body { margin: 0; padding: 0; background: #000; }
    </style>
</head>
<body>
    <script>
        // Tizen API setup — runs before redirect, persists at app level
        try { tizen.power.request('SCREEN', 'SCREEN_NORMAL'); } catch (e) {}
        try {
            webapis.appcommon.setScreenSaver(
                webapis.appcommon.AppCommonScreenSaverState.SCREEN_SAVER_OFF,
                function () {}, function () {}
            );
        } catch (e) {}

        // Redirect to the actual wallpaper app
        window.location.replace('https://geert.github.io/pexel-wallpaper/');
    </script>
</body>
</html>
